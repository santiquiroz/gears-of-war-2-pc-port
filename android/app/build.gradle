plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def gameLibraries = providers.gradleProperty('gow2.gameLibraries').getOrElse('false').toBoolean()

// The placeholder shell builds its own libSDL3.so from SDL's sources.
def sdl3SourceDir = localProperties.getProperty('gow2.sdl3.dir') ?: providers.gradleProperty('gow2.sdl3.dir').getOrNull()
if (!gameLibraries && (!sdl3SourceDir || !file("${sdl3SourceDir}/CMakeLists.txt").exists())) {
    throw new GradleException("Set gow2.sdl3.dir in android/local.properties to the SDL3 source tree " +
            "(thirdparty/sdl3 of a ReXGlue SDK checkout); got '${sdl3SourceDir}'.")
}

// The game's libraries come prebuilt from scripts/build-android.ps1 (android/gamelibs, out/android/jniLibs).
def gameLibsDir = file(providers.gradleProperty('gow2.gameLibs.dir').getOrNull()
        ?: localProperties.getProperty('gow2.gameLibs.dir')
        ?: rootProject.file('../out/android/jniLibs'))
def gameLibraryNames = ['libSDL3.so', 'librexruntime.so', 'librexgpu-xenos.so', 'libgow2.so', 'libc++_shared.so']

android {
    namespace = 'com.santiquiroz.gow2recomp'
    compileSdk = 36
    ndkVersion = '30.0.14904198'

    defaultConfig {
        applicationId = 'com.santiquiroz.gow2recomp'
        minSdk = 29
        targetSdk = 36
        versionCode = 23
        versionName = '0.3.9'
        buildConfigField 'boolean', 'GAME_LIBRARIES', gameLibraries.toString()
        ndk {
            abiFilters 'arm64-v8a'
        }
        if (!gameLibraries) {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_STL=c++_shared',
                            "-DGOW2_SDL3_SOURCE_DIR=${sdl3SourceDir.replace('\\', '/')}"
                    // Same baseline as the SDK's Android build (scripts/build-sdk-android.ps1).
                    cFlags '-march=armv8.2-a'
                    cppFlags '-march=armv8.2-a'
                    targets 'gow2shell', 'SDL3-shared'
                }
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    if (!gameLibraries) {
        externalNativeBuild {
            cmake {
                path = file('src/main/cpp/CMakeLists.txt')
                version = '4.1.2'
            }
        }
    }

    if (gameLibraries) {
        sourceSets {
            main {
                jniLibs.srcDirs = [gameLibsDir]
            }
        }
    }

    packaging {
        jniLibs {
            // Uncompressed and 16 KB aligned inside the APK, loaded from there without extraction.
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

abstract class CopyLicenseAssets extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getLicenseFiles()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copyLicenses() {
        def target = outputDir.get().dir('licenses').asFile
        target.deleteDir()
        target.mkdirs()
        licenseFiles.each { File file ->
            if (!file.isFile()) {
                throw new GradleException("License file ${file} is missing; every APK must carry it " +
                        "(assets/licenses).")
            }
            java.nio.file.Files.copy(file.toPath(), new File(target, file.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

// The APK ships the license texts next to the binaries, copied from the repository so there is
// one copy of each.
def copyLicenseAssets = tasks.register('copyLicenseAssets', CopyLicenseAssets) {
    licenseFiles.from(rootProject.file('../LICENSE'), rootProject.file('../THIRD_PARTY_NOTICES.md'),
            rootProject.file('LICENSE.SDL3.txt'), rootProject.file('LICENSE.SGSR.txt'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(copyLicenseAssets, { it.outputDir })
    }
}

if (gameLibraries) {
    def checkGameLibraries = tasks.register('checkGameLibraries') {
        def abiDir = new File(gameLibsDir, 'arm64-v8a')
        def names = gameLibraryNames
        inputs.property('gameLibsDir', abiDir.absolutePath)
        doLast {
            def missing = names.findAll { !new File(abiDir, it).isFile() }
            if (!missing.isEmpty()) {
                throw new GradleException("gow2.gameLibraries=true but ${missing.join(', ')} " +
                        "${missing.size() == 1 ? 'is' : 'are'} missing from ${abiDir}. Build them with " +
                        "scripts/build-android.ps1, or point gow2.gameLibs.dir at the folder that holds arm64-v8a/.")
            }
        }
    }
    tasks.named('preBuild') { dependsOn checkGameLibraries }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub on the JVM; GpuDriverInstaller reads meta.json with it.
    testImplementation 'org.json:json:20240303'
}
