# Gears of War 2 (PC) settings.
#
# This file sits next to gow2.exe and is read at start-up. Every key is a real setting name;
# command-line flags (--name=value) and REX_* environment variables override it. Delete a line
# to get the built-in default back. Most settings can also be changed in game from the
# runtime's settings overlay.

# ---------- PC Options menu ----------
# The in-game menu (Options > PC Options, F10, or Back+Start) writes the rows you change
# into this file and keeps every comment. See docs/PC_OPTIONS.md.
# Menu language: "auto" follows the system (English or Spanish), "en" or "es" forces one.
# gow2_menu_language = "auto"
# The game's Options > Storage Location button opens the PC Options menu (renamed PC Options).
# gow2_pc_options_entry = true
# Key that opens and closes the PC Options menu from anywhere.
# bind_pc_options = "F10"

# ---------- Saves ----------
# Folder for your saves, profile settings and achievements. Empty = the default
# (%LOCALAPPDATA%\GearsOfWar2PC\user on Windows). Point it at a cloud-synced folder to back up
# and sync your campaign; the first start copies your existing saves there. Single quotes keep
# backslashes as typed. See docs/SAVES.md.
#   gow2_save_dir = '%OneDrive%\GearsOfWar2\saves'
#   gow2_save_dir = 'D:\Dropbox\GearsOfWar2'
#   gow2_save_dir = "saves"   (portable: a folder next to gow2.exe)
gow2_save_dir = ""

# ---------- Display ----------
fullscreen = true

# Internal render resolution as a multiple of the game's 1280x720:
# 1 = 720p (original), 2 = 1440p, 3 = 2160p (4K). Higher values sharpen everything at a GPU
# cost; resolution fixes below keep the post-processing correct when this is above 1.
# Default is automatic: 2 on a dedicated GPU, 1 on an integrated one. To force a value,
# uncomment the next line:
# resolution_scale = 2

# How the final image is scaled to the window: "bilinear" with the stock runtime. Builds made
# with scripts/build-sdk.ps1 (AMD FidelityFX) also accept "cas", "fsr" (FSR 1 spatial) and the
# experimental temporal paths "fsr2" / "fsr3".
present_effect = "bilinear"
# Dither the final 8-bit output to hide banding in smoke, sky and dark corridors.
present_dither = true

# Resolution-scaling resolve fixes (runtime defaults, kept here for clarity).
direct_host_resolve = true
resolve_resolution_scale_fill_half_pixel_offset = true
mrt_edram_used_range_clamp_to_min = true

# ---------- Frame rate ----------
vsync = true
# Community patch: lifts the game's 30 fps cap. Turn vsync off too for more than the refresh rate.
gow2_unlock_fps = false
# Frame rate limit while the frame rate is unlocked (0 = no limit). Takes effect at once.
# gow2_fps_cap = 0

# ---------- Audio ----------
# Master volume in percent (0-100). Takes effect at once.
# gow2_audio_volume = 100

# ---------- Community game patches (xenia-canary/game-patches, authors illusion and boma) ----------
gow2_black_shading_fix = true      # correct character lighting (turns off MSAA resolve artifacts)
gow2_texture_streaming_fix = true  # bigger texture pool, less pop-in
gow2_aniso16 = true                # 16x anisotropic filtering in the game's own sampler setup
gow2_ao_upscaling_fix = true       # ambient occlusion without checkerboard/ghosting when scaled
gow2_dof_upscaling_fix = true      # depth of field without blur artifacts when scaled

# ---------- Textures ----------
# The texture cache can hold more on PC than the console's budget.
texture_cache_memory_limit_soft = 1024
texture_cache_memory_limit_hard = 2048
# Default is automatic: 8x on a dedicated GPU, 2x on an integrated one. To force a value,
# uncomment the next line:
# anisotropic_override = 4

# Texture packs (README, "Texture packs"). Dumps go to textures\4D53082D\dump next to gow2.exe;
# replacements are read from textures\4D53082D\replace (any size, full mip chain).
# texture_dump = false
# texture_replace = false   # turned on by itself while the keycap pack is installed (gow2_keycaps)

# ---------- Keyboard and mouse ----------
# The keyboard and mouse act as an Xbox 360 controller, so every action works as on the console.
# A real controller can be used at the same time.
mnk_mode = true
# While a level is played, keys and mouse buttons reach the game as keys (its own bindings) instead of through the
# emulated pad; menus, the pause menu and cutscenes keep the pad emulation. Needs mnk_mode and a restart.
# gow2_native_keys = true
mnk_mouse = true
mnk_sensitivity = 1.0

# Menu button prompts: "auto" shows the keyboard keys while no controller is connected and
# switches live when one is plugged in or removed (Windows; Android decides at launch),
# "keyboard" always shows them, "controller" keeps the Xbox button art.
gow2_prompts = "auto"
# Show the keys as keycap pictures (the pack that scripts/build-keycaps.ps1 puts in
# textures/4D53082D/replace) instead of text such as [Space].
gow2_keycaps = true

keybind_lstick_up = "W"
keybind_lstick_down = "S"
keybind_lstick_left = "A"
keybind_lstick_right = "D"
keybind_rstick_up = "Up"
keybind_rstick_down = "Down"
keybind_rstick_left = "Left"
keybind_rstick_right = "Right"

keybind_right_trigger = "LMB"    # fire
keybind_left_trigger = "RMB"     # aim
keybind_a = "Space"              # cover, roadie run (hold), roll, vault
keybind_b = "F,V"                # melee, hold for chainsaw
keybind_x = "E"                  # use, pick up, revive
keybind_y = "Q"                  # look at point of interest
keybind_right_shoulder = "R"     # reload (active reload)
keybind_left_shoulder = "G"      # tactical display
keybind_rstick_press = "MMB,Z"   # zoom
keybind_lstick_press = "C"
keybind_dpad_up = "1"            # weapon slots
keybind_dpad_right = "2"
keybind_dpad_down = "3"
keybind_dpad_left = "4"
keybind_back = "Tab"
keybind_start = "Return,Escape"

# ---------- Co-op beyond two players ----------
# Campaign co-op player cap: 2 keeps the retail game; 3+ applies the co-op patch groups
# (Stage 1 and 2) and turns System Link on. Every player, host and friends, sets the same
# value and runs the same build. See docs/COOP_N_PLAYERS.md.
# gow2_coop_players = 2
# gow2_coop_survival = true          # survival rows for players 3+ (false: Stage 1 only)
# gow2_coop_split_revive = false     # true: a standing player 3+ of the downed player's squad counts as a reviver in co-op splits
# gow2_coop_body = true              # bodies and loadouts for players 3+ (false: Stage 1 class and loadout)
# gow2_coop_extra_carmine = false    # true: players 3+ are Ben Carmine where his class is loaded
# gow2_coop_vehicle_ride = true      # vehicle rows (false: vehicles stay retail)
# gow2_coop_scenes = true            # cinematic, teleport, checkpoint and split rows
# gow2_coop_leash = true             # host moves far strays next to Marcus or Dom (Windows; false on Android)
# gow2_coop_leash_distance = 4000    # stray distance in game units
# gow2_coop_leash_seconds = 8        # stray time in seconds

# ---------- Network (System Link) ----------
# System Link (LAN and internet co-op) stays off until this is true on every player's copy;
# gow2_coop_players 3+ turns it on by itself. See docs/NETWORK_PLAY.md.
# net_link_active = true
# With gow2_coop_players 3+ only peers with the same co-op hash see each other's campaigns.
# net_beacon_gate = true
# Guest ports below 1024 move up by this offset, with the link on or off (the game's UDP 1000
# becomes 41000); every player needs the same value.
# net_port_offset = 40000
# This PC's LAN address (and prefix) when the automatic choice is wrong.
# net_local_ip = "192.168.1.10/24"
# Internet play. On the host: the name or address friends reach it at.
# net_public_address = "gow2.example.com"
# On each friend's PC: the host's name or address (comma-separated list).
# net_peers = "gow2.example.com"
# On an internet host: the friends' addresses, ranges or names. Without it, a host with
# net_public_address lets in only the local network and net_peers.
# net_allow_peers = "friend1.example.com, 203.0.113.7"
# system_link_trace = false
# Log the UDP bytes and packets sent to and received from each peer every this many seconds
# ([nettraffic] lines; 0 = off).
# net_traffic_log_sec = 0
